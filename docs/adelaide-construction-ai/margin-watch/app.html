<title>Margin Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Slim top bar with the product mark, a tab strip, one working column up to 1280px; tables and charts scroll inside their own frames. */
:root {
  --bg: #f2f4f5; --panel: #ffffff; --ink: #14212a; --ink-2: #42515a; --ink-3: #66747d;
  --line: #dbe2e6; --line-2: #c3cdd2; --strong: #14212a;
  --accent: #8f530a; --hivis: #e9a23b; --link: #245479; --tint: #f8f3e8;
  --in: #2a78d6; --out: #e34948; --pos: #184f95; --pos-wash: rgba(42, 120, 214, 0.10);
  --grid: #e3e8eb; --axis: #b7c3c9;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --good-bg: #e6f4e6; --warn-bg: #fdf3dc; --crit-bg: #f9e4e4;
  --good-ink: #1d6a28; --warn-ink: #735200; --crit-ink: #a3282a;
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1418; --panel: #162027; --ink: #e4eaed; --ink-2: #b2bec5; --ink-3: #87959e;
    --line: #26343c; --line-2: #34444d; --strong: #d5dde1;
    --accent: #f0b35c; --link: #8fbde0; --tint: #221d14;
    --in: #3987e5; --out: #e66767; --pos: #86b6ef; --pos-wash: rgba(57, 135, 229, 0.14);
    --grid: #22303a; --axis: #3a4a53;
    --good-bg: #16301f; --warn-bg: #302610; --crit-bg: #361a1b;
    --good-ink: #86d890; --warn-ink: #f2c55c; --crit-ink: #f4a0a0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1418; --panel: #162027; --ink: #e4eaed; --ink-2: #b2bec5; --ink-3: #87959e;
  --line: #26343c; --line-2: #34444d; --strong: #d5dde1;
  --accent: #f0b35c; --link: #8fbde0; --tint: #221d14;
  --in: #3987e5; --out: #e66767; --pos: #86b6ef; --pos-wash: rgba(57, 135, 229, 0.14);
  --grid: #22303a; --axis: #3a4a53;
  --good-bg: #16301f; --warn-bg: #302610; --crit-bg: #361a1b;
  --good-ink: #86d890; --warn-ink: #f2c55c; --crit-ink: #f4a0a0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 0 48px; }
a { color: var(--link); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hivis); outline-offset: 2px; }
.shell { max-width: 1280px; margin-inline: auto; display: grid; gap: 16px; }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding-block: 16px 4px; }
.brand { display: flex; align-items: center; gap: 12px; }
.mark { width: 30px; height: 30px; background: var(--hivis); display: grid; place-items: center; color: #14212a; font-weight: 800; font-size: 13px; letter-spacing: 0.02em; border-radius: 3px; }
.brand h1 { margin: 0; font-size: 1.35rem; font-stretch: 80%; font-weight: 800; letter-spacing: 0.01em; line-height: 1; }
.brand p { margin: 2px 0 0; color: var(--ink-3); font-size: 0.85rem; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-family: var(--f-mono); font-size: 0.75rem; color: var(--ink-2); }
.badge { border: 1px solid var(--line-2); padding: 3px 8px; border-radius: 3px; background: var(--panel); white-space: nowrap; }
.badge.demo { border-color: var(--hivis); }

/* tabs */
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1.5px solid var(--strong); scrollbar-width: thin; }
.tab { border: 0; background: transparent; padding: 10px 14px 9px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -1.5px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--hivis); }
.tab .n { font-family: var(--f-mono); font-size: 0.72rem; color: var(--ink-3); margin-left: 4px; font-weight: 500; }

.note-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; background: var(--tint); border: 1px solid var(--line); padding: 10px 14px; font-size: 0.9rem; color: var(--ink-2); }
.note-bar b { color: var(--ink); }

main { display: grid; gap: 18px; min-width: 0; }
h2 { font-size: 1.25rem; font-stretch: 85%; font-weight: 750; margin: 0; line-height: 1.15; text-wrap: balance; }
h3 { font-size: 1rem; font-weight: 700; margin: 0; }
.sub { color: var(--ink-3); font-size: 0.88rem; margin: 2px 0 0; max-width: 72ch; }
.lbl { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spread { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
@media (min-width: 980px) { .grid2 { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); } }
.grid2 > * { min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.panel.flush { padding: 0; }
.panel-head { padding: 14px 16px 0; display: grid; gap: 2px; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); padding: 12px 14px 13px; display: grid; gap: 4px; align-content: start; }
.tile .v { font-size: 1.75rem; font-stretch: 80%; font-weight: 750; line-height: 1.05; }
.tile .c { font-size: 0.82rem; color: var(--ink-2); line-height: 1.35; }
.tile.key { border-top: 3px solid var(--hivis); }
.health { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0; border-top: 1px solid var(--line); margin-top: 12px; }
.hi { padding: 12px 16px 14px; display: grid; gap: 4px; align-content: start; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.hi b { font-size: 1.1rem; font-weight: 700; }
.hi .c { font-size: 0.8rem; color: var(--ink-2); line-height: 1.35; }

/* buttons */
.btn { border: 1.5px solid var(--strong); background: var(--panel); padding: 6px 12px; font-weight: 600; font-size: 0.88rem; border-radius: 3px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn.primary { background: var(--strong); color: var(--panel); }
.btn.primary:hover { opacity: 0.9; }
.btn.ghost { border-color: var(--line-2); font-weight: 500; }
.btn.small { padding: 3px 8px; font-size: 0.8rem; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 4px 11px; font-size: 0.82rem; cursor: pointer; }
.chipbtn[aria-pressed="true"] { background: var(--strong); color: var(--panel); border-color: var(--strong); }
.chipbtn .n { font-family: var(--f-mono); font-size: 0.72rem; opacity: 0.8; margin-left: 3px; }

/* status */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; font-weight: 600; padding: 2px 8px; border-radius: 3px; white-space: nowrap; }
.st i { font-style: normal; width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.st.critical { background: var(--crit-bg); color: var(--crit-ink); } .st.critical i { background: var(--crit); }
.st.warning { background: var(--warn-bg); color: var(--warn-ink); } .st.warning i { background: var(--warn); }
.st.good { background: var(--good-bg); color: var(--good-ink); } .st.good i { background: var(--good); }
.tag { font-family: var(--f-mono); font-size: 0.72rem; border: 1px solid var(--line-2); padding: 1px 6px; border-radius: 3px; white-space: nowrap; color: var(--ink-2); }

/* tables */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th { text-align: left; font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 9px 10px; border-bottom: 1.5px solid var(--strong); white-space: nowrap; vertical-align: bottom; background: var(--panel); }
th.sort { cursor: pointer; }
th.sort:hover { color: var(--ink); }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--bg); }
tr.done td { opacity: 0.45; }
tr.done td.act { opacity: 1; }
.neg { color: var(--crit-ink); }
.pos { color: var(--good-ink); }
.muted { color: var(--ink-3); }
.min-760 { min-width: 760px; } .min-980 { min-width: 980px; } .min-620 { min-width: 620px; }
.quote { font-style: italic; color: var(--ink-2); }

/* stage track */
.track { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; }
.track div { padding: 6px 8px; font-size: 0.78rem; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink-3); min-width: 0; overflow-wrap: anywhere; }
.track div.done { background: var(--strong); color: var(--panel); border-color: var(--strong); }
.track div.current { border: 2px solid var(--hivis); color: var(--ink); font-weight: 600; }
.track small { display: block; font-family: var(--f-mono); font-size: 0.68rem; opacity: 0.85; }
@media (max-width: 640px) { .track { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* AI */
.ai { border: 1px solid var(--line); background: var(--tint); padding: 14px 16px; display: grid; gap: 10px; align-content: start; }
.ai-text { white-space: pre-wrap; font-size: 0.93rem; line-height: 1.55; }
.ai-src { font-family: var(--f-mono); font-size: 0.7rem; color: var(--ink-3); letter-spacing: 0.04em; }
.chat { display: grid; gap: 10px; }
.msg { max-width: 760px; padding: 10px 14px; border: 1px solid var(--line); white-space: pre-wrap; line-height: 1.5; font-size: 0.93rem; }
.msg.me { justify-self: end; background: var(--strong); color: var(--panel); border-color: var(--strong); }
.msg.bot { background: var(--panel); }
.composer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
textarea, input[type="text"], input[type="number"], input[type="date"], select { border: 1px solid var(--line-2); background: var(--panel); padding: 7px 9px; border-radius: 3px; width: 100%; }
textarea { resize: vertical; min-height: 44px; }

/* charts */
.chart { overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; max-width: 960px; }
.chart { min-width: 0; }
.chart svg.wide { min-width: 600px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.8rem; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 4px 16px rgba(0,0,0,0.12); padding: 8px 10px; font-size: 0.8rem; line-height: 1.45; max-width: 280px; }
.tip b { display: block; margin-bottom: 2px; }
.toast { position: fixed; z-index: 40; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--strong); color: var(--panel); padding: 9px 14px; font-size: 0.86rem; max-width: calc(100vw - 32px); }

/* forms */
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 16px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 0.84rem; color: var(--ink-2); }
.drop { border: 2px dashed var(--line-2); padding: 22px; text-align: center; display: grid; gap: 8px; justify-items: center; background: var(--panel); }
.drop.over { border-color: var(--hivis); background: var(--tint); }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; font-size: 0.88rem; }
dl.kv dt { color: var(--ink-3); } dl.kv dd { margin: 0; }
ul.plain { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; max-width: 80ch; }

/* modal */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(10, 16, 20, 0.45); display: grid; place-items: center; padding: 16px; }
.modal-box { background: var(--panel); border: 1.5px solid var(--strong); width: min(640px, 100%); max-height: 88vh; overflow: auto; padding: 18px; display: grid; gap: 12px; }
.modal-box textarea { min-height: 240px; font-family: var(--f-mono); font-size: 0.8rem; }
@media (prefers-reduced-motion: no-preference) { .fade-in { animation: fi 0.2s ease-out; } @keyframes fi { from { opacity: 0.4; } to { opacity: 1; } } }
</style>

<div class="shell">
  <header class="bar">
    <div class="brand">
      <div class="mark" aria-hidden="true">MW</div>
      <div><h1>Margin Watch</h1><p>Live WIP, margin and cash control for home builders</p></div>
    </div>
    <div class="meta" id="meta"></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="note-bar" id="notebar"></div>
  <main id="view" aria-live="polite"></main>
</div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="modal" id="modal" hidden><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal-box"></div></div>

<!--ENGINE-->

<script>
(function () {
  "use strict";
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function money(v) {
    if (v == null || !isFinite(v)) return "—";
    var a = Math.abs(v), sgn = v < 0 ? "−" : "";
    if (a >= 1e6) return sgn + "$" + (a / 1e6).toFixed(2) + "m";
    if (a >= 1e4) return sgn + "$" + Math.round(a / 1e3) + "k";
    return sgn + "$" + Math.round(a).toLocaleString("en-AU");
  }
  function full(v) { if (v == null || !isFinite(v)) return "—"; return (v < 0 ? "−$" : "$") + Math.round(Math.abs(v)).toLocaleString("en-AU"); }
  function pct(v, dp) { return isFinite(v) ? (v * 100).toFixed(dp == null ? 1 : dp) + "%" : "—"; }
  function pts(v) { return (v >= 0 ? "−" : "+") + Math.abs(v * 100).toFixed(1) + " pts"; }
  function dAU(s, withYear) {
    if (!s) return "—"; var d = new Date(s + "T00:00:00Z");
    var y = d.getUTCFullYear(), show = withYear || String(y) !== String(state.settings.asAt).slice(0, 4);
    return d.getUTCDate() + " " + MONTHS[d.getUTCMonth()] + (show ? " " + y : "");
  }
  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }

  // ---------- capabilities ----------
  var useCap = function (n) { try { return window.claude && window.claude.use ? window.claude.use(n) : Promise.resolve(null); } catch (e) { return Promise.resolve(null); } };
  var sampleP = useCap("sample");
  var dlP = useCap("downloads");
  var AI_OFF_CODES = { not_granted: 1, sampling_disabled: 1, not_declared: 1, capability_disabled: 1, capability_removed: 1, unavailable: 1 };
  function aiMsg(e) {
    var c = e && e.code;
    var m = {
      unavailable: "Claude isn't available in this view. Open the page in Claude to use the AI features. Everything else works.",
      not_granted: "AI features are switched off for this page. Everything else still works.",
      sampling_disabled: "Claude isn't available for this account. Everything else still works.",
      rate_limited: "Too many AI requests just now. Wait a minute and try again.",
      session_expired: "Your Claude session has expired. Sign in again and retry.",
      prompt_too_large: "There is too much data for one request. Try a smaller selection.",
      invalid_json: "Claude's answer couldn't be read. Try again.",
      refused: "Claude declined this request.",
      cancelled: "Stopped."
    };
    return m[c] || "The AI request didn't finish. Try again.";
  }
  async function getSample() { var s = await sampleP; if (!s) throw { code: "unavailable" }; return s; }
  async function offerFile(filename, text) {
    var dl = await dlP;
    if (dl) {
      try { await dl.save({ filename: filename, data: text }); toast("Saved " + filename); return; }
      catch (e) { if (e && e.code === "declined") return; }
    }
    openModal("Copy " + filename, '<p class="sub">Saving files isn\'t available here. Copy the contents below into a file named <b>' + esc(filename) + '</b>.</p><textarea id="copy-area" readonly>' + esc(text) + '</textarea><div class="row"><button class="btn primary" data-act="copy-area">Copy</button><button class="btn ghost" data-act="close-modal">Close</button></div>');
  }

  // ---------- state ----------
  var state = {
    data: MW.generate(), source: "demo", settings: Object.assign({}, MW.DEFAULTS),
    tab: "overview", jobId: null, wipFilter: "all", sort: { key: "fadeDollars", dir: -1 }, q: "",
    issueType: "all", done: {}, dismissed: {}, aiNotes: null, aiNotesNonBill: [], scan: null,
    actNow: true, brief: null, chat: [], staged: {}, aiOff: false, introClosed: false,
    bill: { text: "", image: null, result: null }
  };
  var res = null;
  function recompute() {
    var opts = Object.assign({}, state.settings);
    opts.noteFindings = state.aiNotes;
    res = MW.analyse(state.data, opts);
  }

  var TABS = [["overview", "Overview"], ["wip", "WIP schedule"], ["leaks", "Money leaks"], ["bills", "Check a bill"], ["cash", "Cash"], ["ask", "Ask"], ["data", "Your data"], ["method", "Method"]];
  var TYPE = MW.TYPE_LABEL;
  var GROUP = { latepay: "Pay", claim: "Collect", unbilled: "Collect", overdue: "Collect", unsigned: "Collect", overpo: "Stop", duplicate: "Stop", note: "Price", nopo: "Check", overrun: "Check" };
  var ACTION = { latepay: "Schedule payment", claim: "Send claim", unbilled: "Invoice", overdue: "Chase", unsigned: "Chase signature", overpo: "Query supplier", duplicate: "Hold payment", note: "Draft variation", nopo: "Check approval", overrun: "Review" };

  // ---------- render ----------
  function render() {
    renderMeta();
    $("#tabs").innerHTML = TABS.map(function (t) {
      var n = t[0] === "leaks" ? '<span class="n">' + openIssues().length + "</span>" : "";
      return '<button class="tab" role="tab" data-act="tab" data-tab="' + t[0] + '" aria-selected="' + (state.tab === t[0]) + '">' + t[1] + n + "</button>";
    }).join("");
    var nb = $("#notebar");
    if (state.introClosed) { nb.hidden = true; } else {
      nb.hidden = false;
      nb.innerHTML = state.source === "demo"
        ? '<span><b>Demo portfolio.</b> A fictional Adelaide builder with 60 jobs across the northern, southern and Hills growth estates. All names are made up. Load your own exports under <a href="#" data-act="tab" data-tab="data">Your data</a>; files stay in this browser.</span><button class="btn small ghost" data-act="close-intro">Hide</button>'
        : '<span><b>Your data.</b> ' + res.totals.jobs + ' jobs loaded from your files. Nothing has left this browser. AI buttons send only the excerpt they describe.</span><button class="btn small ghost" data-act="close-intro">Hide</button>';
    }
    var v = $("#view");
    var fn = state.tab === "wip" && state.jobId ? function () { return vJob(state.jobId); } : { overview: vOverview, wip: vWip, leaks: vLeaks, bills: vBills, cash: vCash, ask: vAsk, data: vData, method: vMethod }[state.tab];
    v.innerHTML = fn();
    v.classList.remove("fade-in"); void v.offsetWidth; v.classList.add("fade-in");
    afterRender();
  }
  function renderMeta() {
    $("#meta").innerHTML = (state.source === "demo" ? '<span class="badge demo">Demo data · fictional builder</span>' : '<span class="badge">Your data · ' + res.totals.jobs + " jobs</span>") +
      '<span class="badge">As at ' + dAU(state.settings.asAt, true) + "</span>";
  }
  function openIssues() { return res.issues.filter(function (i) { return !state.dismissed[i.id]; }); }
  function riskChip(r) {
    var m = { critical: ["At risk", "critical"], warning: ["Watch", "warning"], good: ["On track", "good"] }[r];
    return '<span class="st ' + m[1] + '"><i></i>' + m[0] + "</span>";
  }
  function jobLabel(id) { var r = res.jobIndex[id]; return r ? esc(id) + ' <span class="muted">· ' + esc(r.job.estate || r.job.suburb || "") + "</span>" : esc(id); }

  // ----- overview -----
  function vOverview() {
    var t = res.totals;
    var tiles = [
      ["Work in progress", money(t.revised), t.jobs + " active jobs, including signed variations"],
      ["Forecast gross margin", pct(t.fcGPpct), pct(t.origGPpct) + " at contract · " + money(t.fcGP) + " forecast profit"],
      ["Margin lost since contract", money(t.fadeDollars), "Cost rises not recovered, summed across jobs"],
      ["Cash to collect now", money(t.collect), "Claims not sent, overdue payments, signed variations not invoiced", "key"],
      ["Overcharges to stop", money(t.stop), "Duplicate bills and bills above purchase order, still unpaid", "key"],

    return '<div class="tiles">' + tiles.map(function (x) { return '<div class="tile ' + (x[3] || "") + '"><span class="lbl">' + x[0] + '</span><span class="v">' + x[1] + '</span><span class="c">' + x[2] + "</span></div>"; }).join("") + "</div>" +

      "</div>" +
      '<section class="panel"><div class="spread"><div><h2>Where margin is fading</h2><p class="sub">Gross margin at contract compared with today\'s forecast, for the 12 jobs that have lost the most. Hover a row for detail; click to open the job.</p></div>' +

  // ----- WIP -----
  var WIP_COLS = [
    ["id", "Job", "s"], ["estate", "Estate", "s"], ["stage", "Stage", "s"], ["revised", "Contract + vars", "m"], ["forecastCost", "Forecast cost", "m"],
    ["costToDate", "Cost to date", "m"], ["pctComplete", "Complete", "p0"], ["earned", "Earned", "m"], ["billed", "Billed", "m"], ["overUnder", "Over/(under) billed", "mu"],

  ];
  function wipVal(r, k) { if (k === "estate") return r.job.estate || r.job.suburb || ""; if (k === "risk") return { critical: 0, warning: 1, good: 2 }[r.risk]; return r[k]; }

      return true;
    });
    var k = state.sort.key, d = state.sort.dir;

      var state_ = c.paid_date ? '<span class="st good"><i></i>Paid ' + dAU(c.paid_date) + "</span>" : c.invoice_date ? '<span class="st warning"><i></i>Invoiced ' + dAU(c.invoice_date) + "</span>" : (c.stage === "Deposit" || r.status[c.stage] === "done") ? '<span class="st critical"><i></i>Not sent</span>' : '<span class="muted">Forecast ' + dAU(r.pred[c.stage]) + "</span>";
      return "<tr><td>" + esc(c.stage) + '</td><td class="n">' + (c.pct ? c.pct + "%" : "") + '</td><td class="n">' + full(c.amount || (c.pct * r.contract / 100)) + "</td><td>" + state_ + "</td></tr>";
    }).join("");

    }).join("") || '<tr><td colspan="4" class="muted">No variations on file.</td></tr>';

    }).join("") || '<tr><td colspan="3" class="muted">No site notes loaded.</td></tr>';
    return '<div class="spread"><div><button class="btn ghost small" data-act="back">← All jobs</button></div><div class="row">' + riskChip(r.risk) + "</div></div>" +
      '<div><h2>Job ' + esc(id) + " · " + esc(j.address || "") + (j.suburb ? ", " + esc(j.suburb) : "") + '</h2><p class="sub">' + [j.estate, j.design, j.client, j.supervisor ? "Supervisor " + j.supervisor : "", j.contract_date ? "Contract " + dAU(j.contract_date, true) : ""].filter(Boolean).map(esc).join(" · ") + "</p></div>" +

      '<section class="ai"><div class="spread"><div><h3>Why this job looks the way it does</h3><p class="sub">Claude reads this job\'s figures, open items and recent site notes.</p></div><div class="row"><button class="btn" data-act="explain" data-id="' + esc(id) + '" id="explain-btn">Explain with Claude</button><button class="btn ghost small" data-act="stop-explain" id="explain-stop" hidden>Stop</button></div></div><div class="ai-text" id="explain-text">' + esc(jobAuto(r, iss)) + '</div><div class="ai-src" id="explain-src">AUTOMATIC SUMMARY</div></section>' +

      '<div class="chips">' + ['<button class="chipbtn" data-act="itype" data-t="all" aria-pressed="' + (state.issueType === "all") + '">All<span class="n">' + all.length + "</span></button>"].concat(types.map(function (tp) {

      overdue: "Subject: Payment reminder, job " + f.job + "\n\nHi,\n\n" + f.detail + " The amount is " + f.amount + ". Please let us know if anything is holding it up.\n\nThanks,\nAccounts team",
      unsigned: "Subject: Variation awaiting your signature, job " + f.job + "\n\nHi,\n\n" + f.detail + " We can schedule the work once it's signed.\n\nThanks",
      overpo: "Subject: Bill above purchase order\n\nHi " + f.supplier + ",\n\n" + f.detail + " Please send a credit note or the approved price change before we process payment.\n\nThanks,\nPurchasing",
      duplicate: "Subject: Possible duplicate bill\n\nHi " + f.supplier + ",\n\n" + f.detail + " Please confirm and void the duplicate.\n\nThanks,\nAccounts",
      note: "VARIATION — job " + f.job + "\nChange: " + f.quote + "\nPrice: " + f.amountOrTbc + "\nTime: to be confirmed\n\nClient signature: ____________   Date: ________",
      latepay: "Subject: Payment of your bill\n\nHi " + f.supplier + ",\n\n" + f.detail + " Sorry for the delay. It is approved and will be paid by [date].\n\nThanks,\nAccounts team",
      nopo: "Job " + f.job + ": " + f.detail + " Can you confirm you approved it?",
      overrun: "Job " + f.job + ": " + f.detail + " Was the price rise approved, and can any part be recovered?"
    };
    return t[i.type] || f.detail;
  }
  var askTurns = [];
  async function ask(q) {
    q = String(q || "").trim(); if (!q) return;
    state.chat.push({ role: "user", content: q });
    render();
    var chat = $("#chat"), bubble = document.createElement("div");
    bubble.className = "msg bot"; bubble.textContent = "Thinking…"; chat.appendChild(bubble);
    ctl.ask = new AbortController(); setBusy("ask", true);
    var sum = MW.summaryForAI(res);
    var jobsLines = res.jobs.map(function (r) { return [r.id, r.job.estate || r.job.suburb || "", r.stage, Math.round(r.contract), (r.origGPpct * 100).toFixed(1), (r.fcGPpct * 100).toFixed(1), Math.round(r.fadeDollars), Math.round(r.overUnder), Math.round(r.issueValue), r.risk].join("|"); }).join("\n");
    var rules = "You are the analyst inside Margin Watch for an Adelaide residential builder. Answer questions about jobs, margins, stage claims, variations, supplier bills and cash using only the data below and the tools. Quote job numbers and dollar amounts. If the data does not answer the question, say so. Keep answers under 170 words unless asked for more. Plain text; short lists starting with \"- \" are fine.\n\nPORTFOLIO (JSON):\n" + JSON.stringify(sum) +
      "\n\nJOBS (job|estate|stage|contract|margin at contract %|forecast margin %|margin lost|over(under) billed|open items $|risk):\n" + jobsLines;
    var turns = [{ role: "user", content: rules }].concat(state.chat.slice(-8));
    var tools = [
      { name: "get_job", description: "Full detail for one job: cost codes (budget, ordered, billed, forecast), open items and recent site notes.", inputSchema: { type: "object", properties: { job_id: { type: "string" } }, required: ["job_id"] }, execute: function (inp) { var r = res.jobIndex[String(inp.job_id)]; if (!r) throw new Error("No job " + inp.job_id); return jobPayload(r); } },
      { name: "list_items", description: "Open money items (claims not sent, overdue payments, unbilled or unsigned variations, bills above PO, duplicate bills, extras in site notes). Optional filters: type (one of claim, overdue, unbilled, unsigned, overpo, duplicate, note, nopo, overrun) and job_id. Returns up to 40, largest first.", inputSchema: { type: "object", properties: { type: { type: "string" }, job_id: { type: "string" } } }, execute: function (inp) { return openIssues().filter(function (i) { return (!inp.type || i.type === inp.type) && (!inp.job_id || i.job_id === String(inp.job_id)); }).sort(function (a, b) { return (b.amount || 0) - (a.amount || 0); }).slice(0, 40).map(function (i) { return { type: TYPE[i.type], job: i.job_id, amount: i.amount, detail: i.detail, quote: i.quote }; }); } },
      { name: "cash_forecast", description: "13-week cash forecast: week start, money in, money out, overheads, closing cash, and main items each week.", execute: function () { return (state.actNow ? res.cash : res.cashAsIs).map(function (w) { return { week_of: w.start, money_in: Math.round(w.inflow), money_out: Math.round(w.outflow), overheads: w.overhead, closing: Math.round(w.closing), items: w.parts }; }); } }
    ];
    try {
      var sample = await getSample();
      var lim = await (sample.limits ? sample.limits().catch(function () { return null; }) : Promise.resolve(null));
      var opts = { signal: ctl.ask.signal, cache: false, onText: function (u) { bubble.textContent = u.text; } };
      if (lim && lim.tools) { delete opts.cache; opts.tools = tools; }
      var out = await sample(turns, opts);
      state.chat.push({ role: "assistant", content: out.text });
    } catch (e) {
      if (e && e.code === "cancelled") { if (e.text) state.chat.push({ role: "assistant", content: e.text }); else state.chat.pop(); }
      else { bubble.textContent = aiMsg(e); state.chat.pop(); if (e && AI_OFF_CODES[e.code]) state.aiOff = true; }
    }
    setBusy("ask", false);
    render();
  }

  // ---------- modal, toast, tooltip ----------
  function openModal(title, body) { $("#modal-box").innerHTML = '<h2 id="modal-title">' + esc(title) + "</h2>" + body; $("#modal").hidden = false; }
  function closeModal() { if (ctl.draft) ctl.draft.abort(); $("#modal").hidden = true; $("#modal-box").innerHTML = ""; }
  var toastT;
  function toast(msg) { var t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2600); }
  function copyText(text, btn) {
    var done = function () { if (btn) { var o = btn.textContent; btn.textContent = "Copied"; setTimeout(function () { btn.textContent = o; }, 1400); } };
    try { navigator.clipboard.writeText(text).then(done, function () { selectFallback(); }); } catch (e) { selectFallback(); }
    function selectFallback() { var a = $("#draft-area") || $("#copy-area"); if (a) { a.focus(); a.select(); } }
  }

  // ---------- events ----------
  function afterRender() {
    if (state.tab === "wip" && state.jobId) return;
    var q = $("#wip-q"); if (q) q.addEventListener("input", function () { state.q = q.value; var pos = q.selectionStart; render(); var q2 = $("#wip-q"); if (q2) { q2.focus(); q2.setSelectionRange(pos, pos); } });
    var f = $("#ask-form"); if (f) f.addEventListener("submit", function (e) { e.preventDefault(); var v = $("#ask-q").value; ask(v); });
    var fi = $("#file-in"); if (fi) fi.addEventListener("change", function () { stageFiles(fi.files); });
    var bt = $("#bill-text"); if (bt) bt.addEventListener("input", function () { state.bill.text = bt.value; });
    var bi = $("#bill-img");
    if (bi) {
      bi.addEventListener("change", function () { state.bill.image = bi.files && bi.files[0] ? bi.files[0] : null; var n = $("#bill-img-name"); if (n) n.textContent = state.bill.image ? state.bill.image.name : ""; });
      sampleP.then(function (smp) { return smp && smp.limits ? smp.limits() : null; }).then(function (l) { var row = $("#bill-img-row"); if (row && l && l.images) row.hidden = false; }).catch(function () {});
    }
    var drop = $("#drop");
    if (drop) {
      drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("over"); });
      drop.addEventListener("dragleave", function () { drop.classList.remove("over"); });
      drop.addEventListener("drop", function (e) { e.preventDefault(); drop.classList.remove("over"); stageFiles(e.dataTransfer.files); });
    }
  }
  function stageFiles(files) {
    var list = Array.prototype.slice.call(files || []);
    Promise.all(list.map(function (f) { return f.text().then(function (txt) { return { name: f.name, text: txt }; }); })).then(function (arr) {
      arr.forEach(function (f) {
        var rows = MW.parseCSV(f.text);
        var key = rows.length ? MW.detectTable(f.name, rows[0]) : null;
        if (!key) { toast("Couldn't tell which table " + f.name + " is. Pick it from the list."); key = "jobs"; }
        var r = MW.importTable(key, f.text); r.file = f.name; r.text = f.text;
        state.staged[key] = r;
      });
      render();
    });
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t) return;
    var act = t.dataset.act;
    if (t.tagName === "A") e.preventDefault();
    switch (act) {
      case "tab": state.tab = t.dataset.tab; state.jobId = null; render(); window.scrollTo(0, 0); break;
      case "close-intro": state.introClosed = true; render(); break;
      case "job": state.tab = "wip"; state.jobId = t.dataset.id; renderJobView(); window.scrollTo(0, 0); break;
      case "back": state.jobId = null; render(); break;
      case "wipf": state.wipFilter = t.dataset.f; render(); break;
      case "sort": var k = t.dataset.k; state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : -1 }; render(); break;
      case "itype": state.issueType = t.dataset.t; render(); break;
      case "done": state.done[t.dataset.id] = !state.done[t.dataset.id]; rerenderKeepJob(); break;
      case "mark-done": state.done[t.dataset.id] = true; closeModal(); rerenderKeepJob(); break;
      case "dismiss": state.dismissed[t.dataset.id] = true; rerenderKeepJob(); break;
      case "draft": draftFor(t.dataset.id); break;
      case "close-modal": closeModal(); break;
      case "copy-draft": copyText(($("#draft-area") || {}).value || "", t); break;
      case "copy-area": copyText(($("#copy-area") || {}).value || "", t); break;
      case "brief": writeBrief(); break;
      case "stop-brief": if (ctl.brief) ctl.brief.abort(); break;
      case "explain": explainJob(t.dataset.id); break;
      case "stop-explain": if (ctl.explain) ctl.explain.abort(); break;
      case "scan": scanNotes(); break;
      case "stop-scan": if (ctl.scan) ctl.scan.abort(); break;
      case "scan-reset": state.aiNotes = null; state.aiNotesNonBill = []; state.scan = null; recompute(); render(); break;
      case "scenario": state.actNow = t.dataset.v === "1"; render(); break;
      case "bill-sample": var smp = billSamples()[+t.dataset.i]; if (smp) { state.bill.text = smp.text; state.bill.image = null; state.bill.result = null; render(); } break;
      case "bill-check": checkBillFlow(); break;
      case "stop-bill": if (ctl.bill) ctl.bill.abort(); break;
      case "bill-draft": billDraft(); break;
      case "suggest": ask(t.textContent); break;
      case "stop-ask": if (ctl.ask) ctl.ask.abort(); break;
      case "clear-chat": state.chat = []; render(); break;
      case "tpl": var spec = MW.tableSpec(t.dataset.k); offerFile(spec.file, MW.toCSV((demoData[t.dataset.k] || []).slice(0, 3), spec.cols.map(function (c) { return c[0]; }))); break;
      case "demo-file": var sp = MW.tableSpec(t.dataset.k); offerFile(sp.file, MW.toCSV(demoData[t.dataset.k] || [], sp.cols.map(function (c) { return c[0]; }))); break;
      case "export-issues": offerFile("margin-watch-items.csv", MW.toCSV(openIssues().map(function (i) { return { group: GROUP[i.type], item: TYPE[i.type], job_id: i.job_id, amount: i.amount || "", days: i.days != null ? i.days : "", detail: i.detail, quote: i.quote || "", status: state.done[i.id] ? "Done" : "Open" }; }), ["group", "item", "job_id", "amount", "days", "detail", "quote", "status"])); break;
      case "export-wip": offerFile("margin-watch-wip.csv", MW.toCSV(res.jobs.map(function (r) { return { job_id: r.id, estate: r.job.estate || "", stage: r.stage, contract: Math.round(r.contract), signed_variations: Math.round(r.varSigned), forecast_cost: Math.round(r.forecastCost), cost_to_date: Math.round(r.costToDate), pct_complete: (r.pctComplete * 100).toFixed(1), earned: Math.round(r.earned), billed: Math.round(r.billed), over_under_billed: Math.round(r.overUnder), margin_at_contract_pct: (r.origGPpct * 100).toFixed(1), forecast_margin_pct: (r.fcGPpct * 100).toFixed(1), margin_lost: Math.round(r.fadeDollars), status: r.risk }; }), ["job_id", "estate", "stage", "contract", "signed_variations", "forecast_cost", "cost_to_date", "pct_complete", "earned", "billed", "over_under_billed", "margin_at_contract_pct", "forecast_margin_pct", "margin_lost", "status"])); break;
      case "analyse-mine":
        if (!state.staged.jobs || !state.staged.jobs.rows.length) { toast("Add a jobs file first."); break; }
        var d = {}; MW.SCHEMA.forEach(function (s) { d[s.key] = state.staged[s.key] ? state.staged[s.key].rows : []; });
        state.data = d; state.source = "yours"; state.aiNotes = null; state.aiNotesNonBill = []; state.scan = null; state.done = {}; state.dismissed = {}; state.brief = null; state.chat = [];
        state.settings.asAt = todayISO(); state.introClosed = false; recompute(); state.tab = "overview"; render(); break;
      case "clear-staged": state.staged = {}; render(); break;
      case "use-demo": state.data = demoData; state.source = "demo"; state.settings.asAt = MW.AS_AT; state.aiNotes = null; state.aiNotesNonBill = []; state.scan = null; state.done = {}; state.dismissed = {}; state.brief = null; state.chat = []; recompute(); state.tab = "overview"; render(); break;
      case "reset-settings": var keepAsAt = state.source === "demo" ? MW.AS_AT : state.settings.asAt; state.settings = Object.assign({}, MW.DEFAULTS, { asAt: keepAsAt }); recompute(); render(); break;
    }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.set) {
      var k = t.dataset.set, kind = t.dataset.kind, v = t.value;
      if (kind === "date") { if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return; state.settings[k] = v; }
      else { var n = parseFloat(v); if (!isFinite(n)) return; state.settings[k] = kind === "pct" ? n / 100 : n; }
      recompute(); render();
    }
    if (t.dataset && t.dataset.act === "restage") {
      var old = t.dataset.k, s = state.staged[old], nk = t.value;
      delete state.staged[old]; var r = MW.importTable(nk, s.text); r.file = s.file; r.text = s.text; state.staged[nk] = r; render();
    }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("#modal").hidden) closeModal(); });
  $("#modal").addEventListener("click", function (e) { if (e.target.id === "modal") closeModal(); });
  var tip = $("#tip");
  document.addEventListener("mousemove", function (e) {
    var t = e.target.closest && e.target.closest("[data-tip]");
    if (!t) { tip.hidden = true; return; }
    tip.innerHTML = t.getAttribute("data-tip"); tip.hidden = false;
    var w = tip.offsetWidth, h = tip.offsetHeight, x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - 14;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
  });
  function rerenderKeepJob() { render(); }
  function renderJobView() { render(); }

  var demoData = state.data;
  recompute();
  render();
})();
</script>
