<title>Nedumkunnam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --laterite:#A0512F; --wall:#F0E7D6; --trim:#7B3B33; --palm:#2F6B42;
  --monsoon:#9FBECB; --ink:#161E22; --paper:#F5EFE4;
  --hud-bg:rgba(22,30,34,.82); --hud-line:rgba(240,231,214,.22); --hud-fg:#F0E7D6;
  --hud-dim:rgba(240,231,214,.58); --accent:#E0A13C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--hud-fg);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none}
#app{position:fixed;inset:0}
canvas#gl{display:block;width:100%;height:100%}

/* ---- nameplate ---- */
#plate{position:fixed;top:16px;left:16px;max-width:min(340px,calc(100vw - 32px));
  pointer-events:none;text-shadow:0 1px 14px rgba(0,0,0,.55)}
#plate .eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);font-weight:600}
#plate h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;
  font-size:clamp(26px,5.2vw,38px);line-height:1.02;margin:5px 0 4px;text-wrap:balance}
#plate .geo{font-size:11px;color:var(--hud-dim);font-variant-numeric:tabular-nums}

/* ---- focus readout ---- */
#focus{position:fixed;left:50%;top:50%;transform:translate(-50%,36px);
  pointer-events:none;text-align:center;opacity:0;transition:opacity .22s ease}
#focus.on{opacity:1}
#focus .nm{font-family:"Instrument Serif",Georgia,serif;font-size:21px;font-style:italic;
  text-shadow:0 1px 12px rgba(0,0,0,.7)}
#focus .mt{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--hud-dim);margin-top:3px}
#retic{position:fixed;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;
  border-radius:50%;background:rgba(240,231,214,.65);pointer-events:none}

/* ---- minimap ---- */
#map{position:fixed;top:16px;right:16px;width:132px;height:132px;border-radius:3px;
  background:var(--hud-bg);border:1px solid var(--hud-line);backdrop-filter:blur(3px)}
#mapc{width:100%;height:100%;display:block;border-radius:2px}

/* ---- bottom rail ---- */
#rail{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px 18px;
  align-items:baseline;padding:9px 16px;background:linear-gradient(transparent,rgba(22,30,34,.9) 45%);
  font-size:11px;color:var(--hud-dim);pointer-events:none}
#rail kbd{font:inherit;font-weight:600;color:var(--hud-fg);background:rgba(240,231,214,.1);
  border:1px solid var(--hud-line);border-radius:3px;padding:1px 5px;margin-right:2px}
#rail .sp{flex:1 1 20px}
#rail a{color:var(--hud-dim);pointer-events:auto}

/* ---- start gate ---- */
#gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 90% at 50% 12%,#2A3A42,#12191D 70%);z-index:9}
#gate.off{display:none}
.card{width:min(430px,100%);text-align:center}
.card .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600}
.card h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;
  font-size:clamp(32px,7vw,46px);line-height:1.02;margin:10px 0 12px;text-wrap:balance}
.card p{font-size:13px;line-height:1.6;color:var(--hud-dim);margin:0 auto 20px;max-width:36ch}
#go{font:600 13px/1 "IBM Plex Sans",sans-serif;letter-spacing:.04em;color:var(--ink);
  background:var(--accent);border:0;border-radius:3px;padding:13px 30px;cursor:pointer}
#go:hover{filter:brightness(1.08)}
#go:focus-visible{outline:2px solid var(--hud-fg);outline-offset:3px}
#go[disabled]{opacity:.55;cursor:progress}
#err{margin-top:14px;min-height:1.2em;font-size:12px;line-height:1.5;color:#F2A98F}

/* ---- who you are ---- */
.field{margin:18px 0 6px;text-align:left}
.field label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--hud-dim);margin-bottom:7px}
#who{width:100%;font:500 15px/1.2 "IBM Plex Sans",sans-serif;color:var(--hud-fg);
  background:rgba(240,231,214,.07);border:1px solid var(--hud-line);border-radius:3px;
  padding:11px 13px}
#who:focus{outline:none;border-color:var(--accent)}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;
  padding:0;background-clip:padding-box}
.sw[aria-pressed="true"]{border-color:var(--hud-fg);box-shadow:0 0 0 2px rgba(0,0,0,.35) inset}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.maker{display:flex;gap:20px;align-items:flex-start}
.maker .cols{flex:1 1 auto;min-width:0}
#avprev{width:96px;height:132px;flex:0 0 auto;border-radius:4px;
  background:linear-gradient(180deg,rgba(240,231,214,.10),rgba(240,231,214,.03));
  border:1px solid var(--hud-line)}

/* ---- in world ---- */
#nearby{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:none;
  font-size:11px;letter-spacing:.06em;color:var(--hud-dim);background:var(--hud-bg);
  border:1px solid var(--hud-line);border-radius:999px;padding:5px 14px;pointer-events:none}
#nearby.on{display:block}
#chatwrap{position:fixed;left:16px;bottom:40px;width:min(330px,calc(100vw - 32px));
  display:flex;flex-direction:column;gap:6px;z-index:4}
#chatlog{display:flex;flex-direction:column;gap:3px;opacity:0;transition:opacity .35s ease}
#chatlog.on{opacity:1}
.cl{font-size:12px;line-height:1.45;color:var(--hud-fg);background:rgba(22,30,34,.78);
  border-radius:3px;padding:4px 9px;align-self:flex-start;max-width:100%;
  overflow-wrap:anywhere}
.cl .who{color:var(--accent);font-weight:600}
.cl.me .who{color:#9FD0A8}
#chatin{width:100%;font:400 13px/1.2 "IBM Plex Sans",sans-serif;color:var(--hud-fg);
  background:rgba(22,30,34,.82);border:1px solid var(--hud-line);border-radius:3px;
  padding:8px 11px;opacity:.55}
#chatin:focus{outline:none;opacity:1;border-color:var(--accent)}
body.touch #chatwrap{bottom:190px}

/* ---- play HUD ---- */
#scores{position:fixed;top:156px;right:16px;width:132px;background:var(--hud-bg);
  border:1px solid var(--hud-line);border-radius:3px;padding:7px 9px 8px;display:none;
  font-size:11px;pointer-events:none}
#scores.on{display:block}
#scores .sh{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  font-weight:600;margin-bottom:4px}
#scores .sr{display:flex;justify-content:space-between;gap:8px;color:var(--hud-dim);
  line-height:1.6;font-variant-numeric:tabular-nums}
#scores .sr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#scores .sr.me{color:var(--hud-fg)}
#scores .sr b{font-weight:600;color:var(--hud-fg)}
#scores .sb{margin-top:4px;padding-top:4px;border-top:1px solid var(--hud-line);
  color:var(--hud-dim);font-size:10px;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:34%;transform:translate(-50%,8px);opacity:0;
  font:600 15px/1 "IBM Plex Sans",sans-serif;color:#1A2228;background:var(--accent);
  border-radius:999px;padding:9px 18px;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#hud{position:fixed;right:16px;bottom:44px;display:none;flex-direction:column;align-items:flex-end;gap:8px;z-index:5}
#hud.on{display:flex}
#hud .row{display:flex;gap:8px}
.hb{font:600 12px/1 "IBM Plex Sans",sans-serif;color:var(--hud-fg);background:var(--hud-bg);
  border:1px solid var(--hud-line);border-radius:999px;padding:9px 14px;cursor:pointer}
.hb:hover{border-color:var(--accent)}
.hb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#jumpbtn{display:none}
body.touch #jumpbtn{display:inline-block;padding:14px 18px}
#emorow{display:none;gap:6px}
#emorow.on{display:flex}
#emorow .hb{padding:8px 11px}
@media (max-width:520px){#scores{top:120px;width:112px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:520px){#chatwrap{width:calc(100vw - 32px)}}
@media (prefers-reduced-motion:reduce){#chatlog{transition:none}}
.meta{margin-top:22px;font-size:10.5px;color:rgba(240,231,214,.4);line-height:1.7}
.meta b{color:var(--hud-dim);font-weight:500;font-variant-numeric:tabular-nums}

/* ---- touch ---- */
#stick{position:fixed;left:22px;bottom:82px;width:106px;height:106px;border-radius:50%;
  border:1px solid var(--hud-line);background:rgba(22,30,34,.45);display:none;touch-action:none}
#nub{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;
  border-radius:50%;background:rgba(240,231,214,.3);border:1px solid var(--hud-line)}
body.touch #stick{display:block}
body.touch #rail .kbdonly{display:none}
@media (max-width:520px){#map{width:96px;height:96px}}
@media (prefers-reduced-motion:reduce){#focus{transition:none}}
</style>
